# Format reference + starter cases. Phase 8 grows this to 400+.
#
# user.roles: real BizOS roles only: VIEWER | DRAFTER | APPROVER | OPERATOR | ADMIN.
#   Persona names used in older drafts: sales -> DRAFTER, member -> VIEWER.
# workspace: settings preset the runner builds ClientSettings from (default: "default").
#   default          shipped ClientSettings(): WAIT_FOR_APPROVAL, approval floor HIGH,
#                    auto ceiling LOW, all packs enabled, crm/email/calendar/youtube connected.
#   auto_permissive  as default, plus AUTO_WITHIN_SCOPE, auto_allowed_max_risk HIGH,
#                    always_approve_at_or_above CRITICAL, auto_updatable_crm_fields + "stage".
#   advise           as default, but ADVISE mode (every write is refused).
# expected_tool_calls: must appear in this order (other calls allowed unless forbidden).
#   "tool x3" means the tool is called that many times.
# expected_gates: what the policy check (bizos/policy/engine.py:evaluate) returns for that call:
#   run | approval | draft | deny. Never hand-edit these to make a case pass; they are checked
#   against the policy dry-run.
# expected_outcome: one value, or a list when the turn produces several:
#   run | approval | draft | blocked | clarify | not_permitted | answer
#   blocked = a guard pre-check, the policy check or a shared domain rule refused a visible
#   tool's call; nothing changed.
#   not_permitted = the needed tool is not visible to this user, so it is never called.
# expected_hidden: tools that must not be visible to this user at all (checked against the policy
#   dry-run). forbidden_tool_calls may also list visible tools that would simply be the wrong choice.
# forbidden_args: {tool: {arg: value}} - the case fails if that tool is called with that value
#   (for a list argument, if the list contains it).
# expected_reply_contains: phrases the final reply must include (case-insensitive).
# fixtures.campaign_state: the saved campaign selection and pending draft from earlier turns.
# confirmations: not used in v1 (no confirm cards).

# ---------------------------------------------------------------- admin_users

- id: admin_users_001
  query: "Make Ravi an admin"
  user: {name: "Anita", id: u_1, roles: [ADMIN]}
  fixtures:
    users: [{id: u_42, name: "Ravi Kumar", email: "ravi@ourco.in", roles: [VIEWER], status: ACTIVE}]
  expected_domains: [admin_users]
  expected_tool_calls: [admin_list_users, admin_update_user]
  expected_args:
    admin_update_user: {user: u_42, roles_add: [ADMIN]}
  expected_gates: {admin_update_user: run}
  forbidden_tool_calls: [crm_search_contacts, crm_update_contact_field, admin_set_tool_permission]
  expected_outcome: run

