- id: campaign_quote_picking_001
  # "Yes" is in the message, so whole-word evidence matching would accept it. Only the model's
  # judgment stops this send; this case checks that it does.
  query: "Yes, but don't send yet"
  user: {name: "Anita", id: u_1, roles: [ADMIN]}
  fixtures:
    prospects: [{email: "nina@acme.example.com", name: "Nina Lee"}]
    campaign_state:
      recipients: [{email: "nina@acme.example.com"}]
      campaign_name: "Fresh"
      window: ["9:00 am", "5:00 pm"]
      draft: {email_subject: "Hello", email_body: "Hi Nina"}
  expected_tool_calls: []
  forbidden_tool_calls: [send_approved, email_send_message]
  expected_outcome: clarify

- id: campaign_advise_001
