  user: {name: "Anita", id: u_1, roles: [ADMIN]}
  workspace: advise
  fixtures:
    prospects: [{email: "nina@acme.example.com", name: "Nina Lee"}]
    campaign_state:
      recipients: [{email: "nina@acme.example.com"}]
      campaign_name: "Fresh"
      window: ["9:00 am", "5:00 pm"]
      draft: {email_subject: "Hello", email_body: "Hi Nina"}
  expected_tool_calls: [send_approved]
  expected_args:
    send_approved: {approval_evidence: "Yes, send it"}
  expected_gates: {send_approved: deny}   # refused (not hidden) in Advise mode
  forbidden_tool_calls: [email_send_message]
  expected_reply_contains: ["Advise"]
  expected_outcome: blocked

