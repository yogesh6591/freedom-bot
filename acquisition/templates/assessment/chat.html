<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business Assessment · JeanneCAIO / FreedomBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,550;9..144,650;9..144,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/assessment.css?v=83">
</head>
<body class="assess">
  <div class="assess-bg" aria-hidden="true"></div>

  <div class="assess-wrap">
    <header class="assess-top">
      <div class="assess-brand">
        <span class="assess-brand-mark">FreedomBot</span>
        <span class="assess-brand-sub">JeanneCAIO · Business assessment</span>
      </div>
      <aside class="assess-topics-card" aria-live="polite" hidden>
        <div class="assess-topics-head">
          <p class="assess-topics-count" id="progress-count" hidden></p>
        </div>
        <div class="assess-meter" aria-hidden="true">
          <span class="assess-meter-fill" id="progress-meter"></span>
        </div>
        <ul class="assess-topics" id="progress-topics" aria-label="Assessment topics" hidden></ul>
      </aside>
    </header>

    <main class="assess-stage">
      <section class="assess-panel is-active" id="assess-panel" data-state="ready">
        <p class="assess-lead" id="lead-text" hidden></p>
        <p class="assess-step" id="step-label">Question</p>
        <h1 class="assess-question" id="question-text">Preparing your first question…</h1>

        <form id="assessment-form" class="assess-answer" autocomplete="off">
          <label class="assess-answer-label" for="assessment-input">Your answer</label>
          <div class="assess-answer-shell">
            <textarea
              id="assessment-input"
              name="content"
              rows="5"
              required
              maxlength="8000"
              placeholder="Type your answer…"
            ></textarea>
          </div>
          <div class="assess-actions">
            <p class="assess-answer-hint">Short is fine · Ctrl/Cmd + Enter</p>
            <p id="assessment-error" class="assess-error" hidden></p>
            <p class="assess-topics-note" id="progress-note" hidden></p>
            <button id="assessment-send" class="assess-continue" type="submit" disabled>
              <span class="assess-continue-label">Continue</span>
              <span class="assess-continue-arrow" aria-hidden="true">→</span>
              <span class="assess-loader" aria-hidden="true"></span>
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script>
  (function () {
    const token = {{ token|tojson }};
    const initialMessages = {{ session.messages|tojson }};
    const initialProgress = {{ (session.progress or none)|tojson }};

    const panel = document.getElementById("assess-panel");
    const leadEl = document.getElementById("lead-text");
    const questionEl = document.getElementById("question-text");
    const stepLabel = document.getElementById("step-label");
    const topicsEl = document.getElementById("progress-topics");
    const topicsNote = document.getElementById("progress-note");
    const topicsCount = document.getElementById("progress-count");
    const topicsMeter = document.getElementById("progress-meter");
    const topicsCard = document.querySelector(".assess-topics-card");
    const form = document.getElementById("assessment-form");
    const input = document.getElementById("assessment-input");
    const sendBtn = document.getElementById("assessment-send");
    const errorEl = document.getElementById("assessment-error");

    let messages = Array.isArray(initialMessages) ? initialMessages.slice() : [];
    let turn = 0;
    let inflight = false;

    function syncSendEnabled() {
      sendBtn.disabled = inflight || !(input.value || "").trim();
    }

    function lastAssistant(list) {
      for (let i = list.length - 1; i >= 0; i--) {
        if (list[i] && list[i].role === "assistant" && (list[i].content || "").trim()) return list[i];
      }
      return null;
    }

    function assistantCount(list) {
      return (list || []).filter(function (m) { return m && m.role === "assistant"; }).length;
    }

    function renderTopics(progress) {
      if (!progress || !Array.isArray(progress.topics) || !progress.topics.length) {
        if (topicsCard) topicsCard.hidden = true;
        return false;
      }
      topicsEl.innerHTML = "";
      let currentSet = false;
      const total = progress.topics.length;
      const doneCount = progress.topics.filter(function (t) { return t.done; }).length;
      progress.topics.forEach(function (topic) {
        const li = document.createElement("li");
        const isCurrent = !topic.done && !currentSet;
        if (isCurrent) currentSet = true;
        li.className = "assess-topic" + (topic.done ? " is-done" : "") + (isCurrent ? " is-current" : "");
        li.title = topic.label + (topic.done ? " (done)" : isCurrent ? " (now)" : "");
        const mark = document.createElement("span");
        mark.className = "assess-topic-mark";
        mark.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.className = "assess-topic-label";
        label.textContent = topic.label;
        li.appendChild(mark);
        li.appendChild(label);
        topicsEl.appendChild(li);
      });
      topicsEl.hidden = false;
      if (topicsCard) topicsCard.hidden = false;
      if (topicsMeter) topicsMeter.style.width = (total ? Math.round((doneCount / total) * 100) : 0) + "%";
      if (topicsCount) {
        topicsCount.hidden = false;
        topicsCount.textContent = doneCount + " of " + total;
      }
      const left = Number(progress.remaining || 0);
      topicsNote.hidden = false;
      topicsNote.textContent = left <= 0 ? "All topics covered" : left + " left after this";
      return true;
    }

    function syncProgress(list, progress) {
      turn = Math.max(1, assistantCount(list));
      renderTopics(progress);
      stepLabel.textContent = "Question " + turn;
    }

    function splitLeadAndQuestion(text) {
      const raw = (text || "").trim() || "Tell me a bit about your business.";
      const parts = raw.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
      if (parts.length >= 2) return { lead: parts.slice(0, -1).join("\n\n"), question: parts[parts.length - 1] };
      const sentences = raw.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [raw];
      const cleaned = sentences.map(function (s) { return s.trim(); }).filter(Boolean);
      if (cleaned.length >= 2 && /^(hi|hello|hey|welcome)\b/i.test(cleaned[0])) {
        return { lead: cleaned.slice(0, -1).join(" "), question: cleaned[cleaned.length - 1] };
      }
      return { lead: "", question: raw };
    }

    function renderPrompt(text) {
      const parts = splitLeadAndQuestion(text);
      if (parts.lead) { leadEl.hidden = false; leadEl.textContent = parts.lead; }
      else { leadEl.hidden = true; leadEl.textContent = ""; }
      questionEl.textContent = parts.question;
    }

    function showQuestion(text, { animate } = { animate: false }) {
      const next = (text || "").trim() || "Tell me a bit about your business.";
      if (!animate) {
        renderPrompt(next);
        panel.classList.remove("is-exit", "is-enter");
        panel.classList.add("is-active");
        return;
      }
      panel.classList.add("is-exit");
      panel.classList.remove("is-active");
      window.setTimeout(function () {
        renderPrompt(next);
        input.value = "";
        syncSendEnabled();
        panel.classList.remove("is-exit");
        panel.classList.add("is-enter");
        void panel.offsetWidth;
        panel.classList.remove("is-enter");
        panel.classList.add("is-active");
        input.focus();
      }, 260);
    }

    function setBusy(busy) {
      inflight = busy;
      input.disabled = busy;
      panel.dataset.state = busy ? "busy" : "ready";
      sendBtn.classList.toggle("is-loading", busy);
      sendBtn.setAttribute("aria-busy", busy ? "true" : "false");
      syncSendEnabled();
    }

    function showError(msg) {
      errorEl.hidden = !msg;
      errorEl.textContent = msg || "";
    }

    function resultPath() {
      var path = (window.location.pathname || "").replace(/\/$/, "");
      return path.slice(-7) === "/result" ? path : path + "/result";
    }

    function applySession(data, { animate } = { animate: false }) {
      messages = data.messages || messages;
      syncProgress(messages, data.progress);
      if (data.completed) { window.location.href = resultPath(); return; }
      const assistant = lastAssistant(messages);
      if (assistant) showQuestion(assistant.content, { animate: animate });
    }

    async function ensureGreeting() {
      setBusy(true);
      try {
        const res = await fetch("/api/assessment/" + encodeURIComponent(token) + "/greeting", {
          method: "POST", headers: { "Accept": "application/json" },
        });
        const data = await res.json();
        if (res.ok) applySession(data, { animate: false });
        else showError("Could not start the assessment. Please refresh.");
      } catch (e) {
        showError("Network error. Please refresh and try again.");
      } finally { setBusy(false); }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      const content = (input.value || "").trim();
      if (!content) return;
      showError("");
      setBusy(true);
      try {
        const res = await fetch("/api/assessment/" + encodeURIComponent(token) + "/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ content: content }),
        });
        const data = await res.json();
        if (!res.ok) {
          showError((data && (data.error || data.detail)) || "Could not continue. Please try again.");
          setBusy(false);
          return;
        }
        if (data.completed) { setBusy(true); window.location.href = resultPath(); return; }
        applySession(data, { animate: true });
      } catch (e) {
        showError("Network error. Your answer may be saved — press Continue to retry.");
      } finally { setBusy(false); }
    });

    input.addEventListener("input", syncSendEnabled);
    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        if (!sendBtn.disabled) form.requestSubmit();
      }
    });
    syncSendEnabled();

    if (lastAssistant(messages)) {
      syncProgress(messages, initialProgress);
      showQuestion(lastAssistant(messages).content, { animate: false });
    } else {
      ensureGreeting();
    }
  })();
  </script>
</body>
</html>
