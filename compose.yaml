# Local development stack: `docker compose up -d --build`
#
# Three services, no Kubernetes and no Redis — neither is needed at this scale
# (§33). The scheduler runs in-process inside AgentOS.
#
# Host ports are shifted off the common defaults so this stack can run alongside
# other local Postgres / Next / API processes:
#   UI  http://localhost:3001   (open this — one app)
#   API http://localhost:8001   (the same process also serves /acquire)
#   DB  localhost:5434 → container 5432
#
# Acquisition is part of this stack: the api image includes the acquisition
# package and serves it at /acquire. The UI proxies that path.

services:
  db:
    # pgvector so the knowledge base has vector search available.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bizos
      POSTGRES_PASSWORD: bizos
      POSTGRES_DB: bizos_control
    ports:
      - "5434:5432"
    volumes:
      - bizos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizos -d bizos_control"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Integrations (Composio: Gmail, Google Calendar, YouTube) read their keys straight from .env, as in
    # ai-automation-saas. Optional, so the stack still starts without a .env file.
    env_file:
      - path: .env
        required: false
    volumes:
      - composio-cache:/app/.composio-cache
    environment:
      RUNTIME_ENV: ${RUNTIME_ENV:-dev}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: bizos
      DB_PASS: bizos
      CONTROL_DB_NAME: bizos_control
      WORKSPACE_DB_PREFIX: bizos_ws_
      SHARED_WORKSPACE_DB: bizos_workspaces
      DEFAULT_DEPLOYMENT_TYPE: ${DEFAULT_DEPLOYMENT_TYPE:-DEDICATED_DB}
      DEFAULT_EXECUTION_MODE: ${DEFAULT_EXECUTION_MODE:-WAIT_FOR_APPROVAL}
      JWT_SECRET: ${JWT_SECRET:-dev-local-signing-key-please-replace-in-production-0001}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-dev-local-secret-encryption-key-replace-0002}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      AGENTOS_URL: ${AGENTOS_URL:-http://127.0.0.1:8001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # COMPOSIO_API_KEY comes from .env (env_file above); an empty default here would override it.
      COMPOSIO_CACHE_DIR: /app/.composio-cache
      # FB-043: shared secret for the checkout/contract sale webhook.
      SALE_WEBHOOK_SECRET: ${SALE_WEBHOOK_SECRET:-}
      MODEL_ID: ${MODEL_ID:-gpt-4.1-mini}
      EXECUTOR_MODEL_ID: ${EXECUTOR_MODEL_ID:-}
      ROUTER_MODEL_ID: ${ROUTER_MODEL_ID:-}
      # Meaning-based memory search (pgvector + OpenAI embeddings). off disables it.
      MEMORY_VECTOR_SEARCH: ${MEMORY_VECTOR_SEARCH:-on}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-}
      # Background sync of each user's Composio sources (bizos/sync): on|off, and seconds between runs.
      INTEGRATION_SYNC_ENABLED: ${INTEGRATION_SYNC_ENABLED:-on}
      INTEGRATION_SYNC_INTERVAL_SEC: ${INTEGRATION_SYNC_INTERVAL_SEC:-300}
      EXECUTOR_REASONING_EFFORT: ${EXECUTOR_REASONING_EFFORT:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AGENT_PIPELINE_V2: ${AGENT_PIPELINE_V2:-}
      # Optional: none | low | medium | high. Leave unset for models that reject it with tools.
      MODEL_REASONING_EFFORT: ${MODEL_REASONING_EFFORT:-}
      # Acquisition runs in this process, on its own database.
      DATABASE_URL: postgresql+psycopg://${DB_USER:-bizos}:${DB_PASS:-bizos}@db:5432/${ACQUISITION_DB_NAME:-acquisition}
      ACQUISITION_URL_PREFIX: /acquire
      PUBLIC_BASE_URL: http://localhost:3001/acquire
      ADMIN_USERNAME: ${ADMIN_USERNAME:-jeanne}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SECRET_KEY: ${ACQUISITION_SECRET_KEY:-dev-local-acquisition-session-key-0001}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      CALCOM_API_BASE_URL: ${CALCOM_API_BASE_URL:-https://api.cal.com/v2}
      CALCOM_WEBHOOK_SECRET: ${CALCOM_WEBHOOK_SECRET:-}
    ports:
      - "8001:8000"
    # Create the acquisition database, migrate it, seed the demo workspaces, then serve.
    command: >
      sh -c "python -m scripts.ensure_acquisition_db &&
             python -m alembic -c acquisition_alembic.ini upgrade head &&
             python -m scripts.bootstrap --demo &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

  ui:
    build:
      context: ./ui
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8001}
        ACQUISITION_PROXY_URL: http://api:8000
    environment:
      ACQUISITION_PROXY_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  bizos-db:
  composio-cache:
