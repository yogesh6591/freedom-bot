# Production side-by-side stack for FreedomBot Core / AgentOS.
# Unique container names — does NOT touch freedombot-platform.
# Usage:
#   docker compose -p freedom-bot-core -f compose.prod.yaml up -d --build

name: freedom-bot-core

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: fb-core-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizos
      POSTGRES_PASSWORD: ${CORE_DB_PASS}
      POSTGRES_DB: bizos_control
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - fb_core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizos -d bizos_control"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Local OpenAI Whisper base.en via whisper.cpp (CPU, ARM64). Internal network only.
  # Profile-gated: normal `up -d --build api ui` does NOT start this. Enable later with
  # `docker compose -p freedom-bot-core -f compose.prod.yaml --profile whisper up -d whisper`.
  whisper:
    build:
      context: ./docker/whisper
      args:
        WHISPER_CPP_REF: v1.9.5
    image: freedom-bot-core-whisper:base-en
    platform: linux/arm64
    container_name: fb-core-whisper
    restart: unless-stopped
    profiles: ["whisper"]
    volumes:
      - fb_core_whisper_models:/models
    environment:
      WHISPER_MODEL: base.en
      WHISPER_THREADS: "2"
    # No host `ports:` — only reachable as http://whisper:8080 on freedom-bot-core-net.
    expose:
      - "8080"
    mem_limit: 768m
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  api:
    build: .
    container_name: fb-core-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RUNTIME_ENV: ${RUNTIME_ENV:-dev}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: bizos
      DB_PASS: ${CORE_DB_PASS}
      CONTROL_DB_NAME: bizos_control
      WORKSPACE_DB_PREFIX: bizos_ws_
      SHARED_WORKSPACE_DB: bizos_workspaces
      DEFAULT_DEPLOYMENT_TYPE: ${DEFAULT_DEPLOYMENT_TYPE:-DEDICATED_DB}
      DEFAULT_EXECUTION_MODE: ${DEFAULT_EXECUTION_MODE:-WAIT_FOR_APPROVAL}
      JWT_SECRET: ${JWT_SECRET}
      # Agno AgentOS authorization=True requires a verification key (HS256: same as JWT_SECRET).
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: https://freedombot-core.cloud.cepoch.com
      AGENTOS_URL: https://freedombot-core-api.cloud.cepoch.com
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Website self-serve signup (app/api/signup.py); empty switches it off.
      SELF_SERVE_SIGNUP_KEY: ${SELF_SERVE_SIGNUP_KEY:-}
      OPENAI_WEB_MODEL: ${OPENAI_WEB_MODEL:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      CALCOM_API_BASE_URL: ${CALCOM_API_BASE_URL:-https://api.cal.com/v2}
      CALCOM_WEBHOOK_SECRET: ${CALCOM_WEBHOOK_SECRET:-}
      INSTANTLY_API_KEY: ${INSTANTLY_API_KEY:-}
      INSTANTLY_WEBHOOK_SECRET: ${INSTANTLY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      MODEL_ID: ${MODEL_ID:-gpt-4.1-mini}
      EXECUTOR_MODEL_ID: ${EXECUTOR_MODEL_ID:-}
      TRANSCRIPT_API_KEY: ${TRANSCRIPT_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_ID: ${GEMINI_MODEL_ID:-}
      ROUTER_MODEL_ID: ${ROUTER_MODEL_ID:-}
      MODEL_REASONING_EFFORT: ${MODEL_REASONING_EFFORT:-}
      AGENT_PIPELINE_V2: ${AGENT_PIPELINE_V2:-}
      DATABASE_URL: postgresql+psycopg://${DB_USER:-bizos}:${DB_PASS}@db:5432/${ACQUISITION_DB_NAME:-acquisition}
      ACQUISITION_URL_PREFIX: /acquire
      PUBLIC_BASE_URL: https://freedombot-core.cloud.cepoch.com/acquire
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      # Chat mic → local whisper.cpp when the whisper profile/service is running.
      WHISPER_URL: ${WHISPER_URL:-http://whisper:8080}
      # Whole policy system: on = as today, off = no policy anywhere.
      POLICY_ENABLED: ${POLICY_ENABLED:-on}
      # New support ticket emails (technical -> yogesh@, business -> jeanne@ when SUPPORT_EMAIL_JEANNE=on).
      SUPPORT_TICKET_EMAILS: ${SUPPORT_TICKET_EMAILS:-on}
      SUPPORT_EMAIL_JEANNE: ${SUPPORT_EMAIL_JEANNE:-off}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://freedombot-core.cloud.cepoch.com}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:8030:8000"
    command: >
      sh -c "python -m scripts.ensure_acquisition_db &&
             python -m alembic -c acquisition_alembic.ini upgrade head &&
             python -m scripts.bootstrap &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # AgentOS publishes public /health; /api/health is behind auth in prd.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  ui:
    build:
      context: ./ui
      args:
        NEXT_PUBLIC_API_URL: https://freedombot-core.cloud.cepoch.com
    container_name: fb-core-ui
    restart: unless-stopped
    environment:
      # /signup (self-serve onboarding) calls the API on the internal network with the shared signup key.
      FREEDOMBOT_API_URL: http://api:8000
      SELF_SERVE_SIGNUP_KEY: ${SELF_SERVE_SIGNUP_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8031:3000"

  # Marketing website (./Website). Reached through the ui at https://freedombot-core.cloud.cepoch.com/website
  # (ui rewrites /website/* to it on the internal network). Its Sign up goes to the ui's /signup onboarding.
  website:
    build:
      context: ./Website
      args:
        NEXT_PUBLIC_APP_URL: https://freedombot-core.cloud.cepoch.com
    container_name: fb-core-website
    restart: unless-stopped

networks:
  default:
    name: freedom-bot-core-net
    external: true

volumes:
  fb_core_pgdata:
  fb_core_whisper_models:
